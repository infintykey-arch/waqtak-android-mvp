plugins {
    id 'com.android.application'
}

def releaseStorePath = System.getenv('MIDAD_RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('MIDAD_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('MIDAD_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('MIDAD_RELEASE_KEY_PASSWORD')

android {
    namespace 'com.wirdi.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.wirdi.app'
        minSdk 23
        targetSdk 35
        versionCode 11
        versionName '0.1.10'
    }

    signingConfigs {
        release {
            if (releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
}
